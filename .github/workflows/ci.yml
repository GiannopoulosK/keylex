name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check keylex tests examples benchmarks
      - run: ruff format --check keylex tests examples benchmarks
      # strict mypy must pass with and without the optional extras installed
      - run: mypy
      - run: pip install numpy "spacy>=3.5,<4" && mypy

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
      # spaCy may not ship wheels for the newest Python yet; its tests skip themselves then
      - run: pip install -e ".[dev,all]" || pip install -e ".[dev,yaml,fast]"
        shell: bash
      - run: python -m spacy download en_core_web_sm || true
        shell: bash
      - run: pytest --cov=keylex --cov-report=term-missing --cov-report=xml
      # the core library must also work without the optional extras (numpy, spaCy, PyYAML)
      - run: pip uninstall -y spacy thinc numpy pyyaml && pytest -q
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash

  package:
    name: Build & check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # the sdist must be self-contained: install it and run its own test suite
      - name: Test the sdist
        shell: bash
        run: |
          mkdir sdist-test && tar xzf dist/*.tar.gz -C sdist-test --strip-components=1
          cd sdist-test && pip install ".[dev]" && pytest -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
