site_name: keylex
site_description: Keyword matching where keywords are objects - synonyms, acronyms, fuzzy matching, rules and keyword extraction.
site_url: https://giannopoulosk.github.io/keylex/
repo_url: https://github.com/GiannopoulosK/keylex
repo_name: GiannopoulosK/keylex
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Guide: index.md
  - API reference:
      - Keywords: api/keywords.md
      - Matching: api/matching.md
      - Rules: api/rules.md
      - Keyword extraction: api/extraction.md
      - spaCy: api/spacy.md
      - Text utilities: api/text.md
  - Changelog: changelog.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters: ["!^_"]

validation:
  links:
    # README/CHANGELOG are shared with GitHub and PyPI and link to repository files
    not_found: info
    unrecognized_links: info
